// Turns a guest record into a full roster entry — pre-fills the name and
// emergency contact they already gave, only asks for the remaining fields
// a real student profile needs. Deletes the guest record once promoted so
// they don't exist in both places at once.
function PromoteGuestForm({ guest, onClose, flashToast }) {
  const [form, setForm] = useState({
    birthday: "", grade: "",
    phone: "", email: ""
  });
  const [error, setError] = useState("");
  const gradeOptions = ["5", "6", "7", "8", "9", "10", "11", "12"];

  function set(k, v) { setForm(f => ({ ...f, [k]: v })); }

  async function submit() {
    if (!form.birthday || !form.grade) return setError("Birthday and grade are required.");
    const grade = parseInt(form.grade, 10);
    const roster = [grade <= 8 ? "MS" : "HS"];
    try {
      await db.collection("students").add({
        name: guest.name, birthday: form.birthday, grade, roster, role: "student",
        phone: form.phone.trim(), email: form.email.trim(), active: true,
        // Guests no longer collect an email, but the students schema still
        // requires the key to exist (even empty) — build a complete object
        // rather than passing guest.emergency through as-is.
        emergency: {
          relationship: guest.emergency?.relationship || "",
          name: guest.emergency?.name || "",
          phone: guest.emergency?.phone || "",
          email: guest.emergency?.email || ""
        },
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await db.collection("eventGuests").doc(guest.id).delete();
      flashToast(`${guest.name} added to the roster.`);
      onClose();
    } catch (e) {
      setError("Couldn't save: " + (e.message || e));
    }
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <h2>Promote {guest.name}</h2>
        <div className="sub">Their name and emergency contact carry over — just fill in the rest.</div>
        <div className="field"><label>Birthday *</label><input type="date" value={form.birthday} onChange={e => set("birthday", e.target.value)} /></div>
        <div className="field"><label>Grade *</label>
          <select value={form.grade} onChange={e => set("grade", e.target.value)}>
            <option value="">Select grade…</option>
            {gradeOptions.map(g => <option key={g} value={g}>{g}th grade</option>)}
          </select>
        </div>
        <div className="field-row">
          <div className="field"><label>Phone (optional)</label><input type="tel" value={form.phone} onChange={e => set("phone", e.target.value)} /></div>
          <div className="field"><label>Email (optional)</label><input type="email" value={form.email} onChange={e => set("email", e.target.value)} /></div>
        </div>
        {error && <div className="error-text">{error}</div>}
        <div className="btn-row">
          <button className="btn secondary" onClick={onClose}>Cancel</button>
          <button className="btn primary" onClick={submit}>Add to Roster</button>
        </div>
      </div>
    </div>
  );
}

function PromoteTab({ students, flashToast }) {
  const [confirming, setConfirming] = useState(false);
  const active = students.filter(s => s.active !== false && typeof s.grade === "number");
  const seniors = active.filter(s => s.grade === 12);
  const eighth = active.filter(s => s.grade === 8);

  async function promote() {
    const batch = db.batch();
    active.forEach(s => {
      const ref = db.collection("students").doc(s.id);
      if (s.grade === 12) {
        batch.update(ref, { active: false });
      } else {
        const newGrade = s.grade + 1;
        const newRoster = [newGrade <= 8 ? "MS" : "HS"];
        batch.update(ref, { grade: newGrade, roster: newRoster });
      }
    });
    await batch.commit();
    setConfirming(false);
    flashToast("Everyone's been promoted a grade.");
  }

  return (
    <div style={{ maxWidth: 480 }}>
      <div className="stat-grid">
        <div className="stat-card"><div className="num">{active.length}</div><div className="lbl">Active students</div></div>
        <div className="stat-card"><div className="num">{eighth.length}</div><div className="lbl">8th → moving to HS</div></div>
        <div className="stat-card"><div className="num">{seniors.length}</div><div className="lbl">Seniors → going inactive</div></div>
      </div>
      <p className="sub">
        Run this once a year (start of the school year). Every active student with a grade moves up one grade;
        8th graders switch to the HS roster; current 12th graders are marked inactive (not deleted).
        Leaders (no grade on file) are skipped automatically. Add incoming 5th graders manually beforehand
        from the Roster tab — they'll count as Middle School even though they're not offered as a grade
        option on the self-serve form.
      </p>
      {!confirming
        ? <button className="btn primary" style={{ width: "100%" }} onClick={() => setConfirming(true)}>Promote Everyone</button>
        : (
          <>
            <div className="error-text" style={{ marginBottom: 12 }}>This can't be undone automatically. Are you sure?</div>
            <div className="btn-row">
              <button className="btn secondary" onClick={() => setConfirming(false)}>Cancel</button>
              <button className="btn danger" onClick={promote}>Yes, promote everyone</button>
            </div>
          </>
        )}
    </div>
  );
}

function TrendsTab({ attendance, students }) {
  const msRef = useRef(null), hsRef = useRef(null), combinedRef = useRef(null), sundayRef = useRef(null);
  const chartsRef = useRef({});

  // Wednesday is genuinely two separate concurrent meetings, so these three
  // charts are scoped to Wednesday attendance only (categorizeEvent keys
  // off the "(Wed)" event names). Sunday/Events are one combined gathering
  // and get their own separate chart below, counting everyone together.
  const weeklyData = useMemo(() => {
    const byDate = {};
    attendance.filter(a => categorizeEvent(a.event) === "wednesday").forEach(a => {
      byDate[a.date] = byDate[a.date] || { MS: 0, HS: 0 };
      byDate[a.date][a.room] = (byDate[a.date][a.room] || 0) + 1;
    });
    const dates = Object.keys(byDate).sort().slice(-16);
    return {
      labels: dates.map(fmtDate),
      ms: dates.map(d => byDate[d].MS || 0),
      hs: dates.map(d => byDate[d].HS || 0),
      combined: dates.map(d => (byDate[d].MS || 0) + (byDate[d].HS || 0))
    };
  }, [attendance]);

  const sundayWeeklyData = useMemo(() => {
    const byDate = {};
    attendance.filter(a => categorizeEvent(a.event) === "sunday").forEach(a => {
      byDate[a.date] = byDate[a.date] || new Set();
      byDate[a.date].add(a.studentId);
    });
    const dates = Object.keys(byDate).sort().slice(-16);
    return {
      labels: dates.map(fmtDate),
      combined: dates.map(d => byDate[d].size)
    };
  }, [attendance]);

  useEffect(() => {
    Object.values(chartsRef.current).forEach(c => c && c.destroy());
    const mk = (ref, label, labels, data, color) => {
      if (!ref.current) return null;
      return new Chart(ref.current, {
        type: "line",
        data: { labels, datasets: [{ label, data, borderColor: color, backgroundColor: color + "33", fill: true, tension: 0.3 }] },
        options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { color: "#B0B0B0" } }, x: { ticks: { color: "#B0B0B0" } } } }
      });
    };
    chartsRef.current.ms = mk(msRef, "MS Attendance (Wed)", weeklyData.labels, weeklyData.ms, "#FFD400");
    chartsRef.current.hs = mk(hsRef, "HS Attendance (Wed)", weeklyData.labels, weeklyData.hs, "#7A3327");
    chartsRef.current.combined = mk(combinedRef, "Combined (Wed)", weeklyData.labels, weeklyData.combined, "#FFFFFF");
    chartsRef.current.sunday = mk(sundayRef, "Sunday (Everyone)", sundayWeeklyData.labels, sundayWeeklyData.combined, "#FFFFFF");
  }, [weeklyData, sundayWeeklyData]);

  const wholeRosterSize = students.filter(s => s.role !== "leader" && s.active !== false).length;
  const msRosterSize = students.filter(s => s.role !== "leader" && s.active !== false && rosterArray(s).includes("MS")).length;
  const hsRosterSize = students.filter(s => s.role !== "leader" && s.active !== false && rosterArray(s).includes("HS")).length;

  // Sunday/Events are one combined gathering — count distinct people
  // regardless of which room their attendance record landed in. Wednesday
  // is genuinely two separate concurrent meetings, so it stays split.
  function buildCombinedTable(category, n) {
    const filtered = attendance.filter(a => categorizeEvent(a.event) === category);
    const dates = [...new Set(filtered.map(a => a.date))].sort().reverse().slice(0, n);
    return dates.map(date => {
      const attendees = new Set(filtered.filter(a => a.date === date).map(a => a.studentId));
      return { date, count: attendees.size, pct: wholeRosterSize > 0 ? Math.round((attendees.size / wholeRosterSize) * 100) : 0 };
    });
  }
  function buildRoomTable(category, room, n) {
    const filtered = attendance.filter(a => categorizeEvent(a.event) === category && a.room === room);
    const dates = [...new Set(filtered.map(a => a.date))].sort().reverse().slice(0, n);
    const rosterSize = room === "MS" ? msRosterSize : hsRosterSize;
    return dates.map(date => {
      const attendees = new Set(filtered.filter(a => a.date === date).map(a => a.studentId));
      return { date, count: attendees.size, pct: rosterSize > 0 ? Math.round((attendees.size / rosterSize) * 100) : 0 };
    });
  }
  const sundayRows = buildCombinedTable("sunday", 8);
  const wednesdayMsRows = buildRoomTable("wednesday", "MS", 8);
  const wednesdayHsRows = buildRoomTable("wednesday", "HS", 8);

  // Special Events are irregular and often pull in one-time guests, so they
  // don't fit a weekly line chart or a "% of roster" comparison the way
  // Sunday/Wednesday do — a plain chronological list of what happened is
  // more useful than trying to force them into the same shape.
  const specialEvents = useMemo(() => {
    const filtered = attendance.filter(a => isRecordCombined(a) && a.event !== "Sunday Morning");
    const byKey = {};
    filtered.forEach(a => {
      const key = a.date + "|" + a.event;
      if (!byKey[key]) byKey[key] = { key, date: a.date, event: a.event, studentIds: new Set(), guestIds: new Set() };
      byKey[key].studentIds.add(a.studentId);
      if (a.isGuest) byKey[key].guestIds.add(a.studentId);
    });
    return Object.values(byKey)
      .map(e => ({ key: e.key, date: e.date, event: e.event, total: e.studentIds.size, guests: e.guestIds.size }))
      .sort((a, b) => b.date.localeCompare(a.date))
      .slice(0, 12);
  }, [attendance]);
  const totalEventAttendance = specialEvents.reduce((sum, e) => sum + e.total, 0);

  function SessionTable({ title, rows, rosterSize }) {
    return (
      <div className="chart-card">
        <h3>{title}</h3>
        <div className="sub" style={{ marginBottom: 12 }}>Out of {rosterSize} active student{rosterSize !== 1 ? "s" : ""} on this roster.</div>
        {rows.length === 0
          ? <div className="empty-state">No sessions recorded yet.</div>
          : (
            <div className="row-list">
              {rows.map(r => (
                <div key={r.date} className="row-item">
                  <div className="rn">{fmtDate(r.date)}</div>
                  <div style={{ textAlign: "right" }}>
                    <div className="rn">{r.count} attended</div>
                    <div className="rs">{r.pct}% of roster</div>
                  </div>
                </div>
              ))}
            </div>
          )}
      </div>
    );
  }

  return (
    <>
      <div className="chart-card"><h3>Wednesday — Combined (MS + HS)</h3><canvas ref={combinedRef}></canvas></div>
      <div className="chart-card"><h3>Wednesday — Middle School (Torrid)</h3><canvas ref={msRef}></canvas></div>
      <div className="chart-card"><h3>Wednesday — High School (The Barn)</h3><canvas ref={hsRef}></canvas></div>
      <div className="chart-card"><h3>Sunday — Everyone</h3><canvas ref={sundayRef}></canvas></div>
      <SessionTable title="Last 8 Sundays" rows={sundayRows} rosterSize={wholeRosterSize} />
      <SessionTable title="Last 8 Wednesdays — Torrid (MS)" rows={wednesdayMsRows} rosterSize={msRosterSize} />
      <SessionTable title="Last 8 Wednesdays — The Barn (HS)" rows={wednesdayHsRows} rosterSize={hsRosterSize} />

      <div className="chart-card">
        <h3>Special Events</h3>
        <div className="sub" style={{ marginBottom: 12 }}>
          These are one-off and often bring in guests who aren't part of your regular roster, so there's no weekly chart or roster percentage here — just what actually happened at each one.
        </div>
        {specialEvents.length > 0 && (
          <div className="stat-grid" style={{ marginBottom: 16 }}>
            <div className="stat-card"><div className="num">{specialEvents.length}</div><div className="lbl">Events tracked</div></div>
            <div className="stat-card"><div className="num">{totalEventAttendance}</div><div className="lbl">Total attendance</div></div>
            <div className="stat-card"><div className="num">{Math.round(totalEventAttendance / specialEvents.length)}</div><div className="lbl">Avg. per event</div></div>
          </div>
        )}
        {specialEvents.length === 0
          ? <div className="empty-state">No special events recorded yet.</div>
          : (
            <div className="row-list">
              {specialEvents.map(e => (
                <div key={e.key} className="row-item">
                  <div>
                    <div className="rn">{e.event}</div>
                    <div className="rs">{fmtDate(e.date)}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div className="rn">{e.total} attended</div>
                    {e.guests > 0 && <div className="rs">{e.guests} guest{e.guests !== 1 ? "s" : ""}</div>}
                  </div>
                </div>
              ))}
            </div>
          )}
      </div>
    </>
  );
}

function ProfileModal({ student, attendance, onClose, flashToast }) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({ ...student });
  const [pendingDelete, setPendingDelete] = useState(false);
  const [deleting, setDeleting] = useState(false);
  const history = attendance.filter(a => a.studentId === student.id).sort((a, b) => b.date.localeCompare(a.date));
  const yearStats = attendanceStatsForStudent(student.id, attendance);

  async function save() {
    const parsedGrade = parseInt(form.grade, 10);
    await db.collection("students").doc(student.id).update({
      name: form.name, grade: Number.isFinite(parsedGrade) ? parsedGrade : null, birthday: form.birthday,
      phone: form.phone || "", email: form.email || "",
      emergency: form.emergency || {}
    });
    flashToast("Profile updated.");
    setEditing(false);
  }
  async function toggleActive() {
    await db.collection("students").doc(student.id).update({ active: !(student.active !== false) });
    flashToast(student.active === false ? "Marked active." : "Marked inactive.");
  }
  async function confirmPermanentDelete() {
    setPendingDelete(false);
    setDeleting(true);
    try {
      const batch = db.batch();
      history.forEach(h => batch.delete(db.collection("attendance").doc(h.id)));
      batch.delete(db.collection("students").doc(student.id));
      await batch.commit();
      flashToast(`Permanently deleted ${student.name}.`);
      onClose();
    } catch (e) {
      window.alert("Delete failed: " + e.message);
      setDeleting(false);
    }
  }

  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet wide" onClick={e => e.stopPropagation()}>
        {!editing ? (
          <>
            <h2>{student.name}</h2>
            <div className="sub">{student.role === "leader" ? "Leader" : `Grade ${student.grade}`} · {rosterArray(student).join(" + ")} {student.active === false ? "· Inactive" : ""}</div>
            <div className="stat-grid">
              <div className="stat-card"><div className="num">{history.length}</div><div className="lbl">Total check-ins</div></div>
              <div className="stat-card"><div className="num">{history[0] ? fmtDate(history[0].date) : "—"}</div><div className="lbl">Last seen</div></div>
              <div className="stat-card"><div className="num">{student.role === "leader" ? "—" : student.grade}</div><div className="lbl">Grade</div></div>
            </div>
            <div className="section-title">This Ministry Year (since Labor Day)</div>
            <div className="stat-grid">
              <div className="stat-card"><div className="num">{yearStats.sunday.pct === null ? "—" : yearStats.sunday.pct + "%"}</div><div className="lbl">Sundays ({yearStats.sunday.attended}/{yearStats.sunday.total})</div></div>
              <div className="stat-card"><div className="num">{yearStats.wednesday.pct === null ? "—" : yearStats.wednesday.pct + "%"}</div><div className="lbl">Wednesdays ({yearStats.wednesday.attended}/{yearStats.wednesday.total})</div></div>
              <div className="stat-card"><div className="num">{yearStats.events.pct === null ? "—" : yearStats.events.pct + "%"}</div><div className="lbl">Events ({yearStats.events.attended}/{yearStats.events.total})</div></div>
            </div>
            <div className="section-title">Contact</div>
            <div className="sub">Birthday: {student.birthday || "—"} · Phone: {student.phone || "—"} · Email: {student.email || "—"}</div>
            <div className="section-title">Emergency contact</div>
            <div className="sub">
              {student.emergency?.name} ({student.emergency?.relationship}) · {student.emergency?.phone} · {student.emergency?.email}
            </div>
            <div className="section-title">Attendance history</div>
            <div className="row-list" style={{ maxHeight: 220, overflowY: "auto" }}>
              {history.map(h => (
                <div key={h.id} className="row-item"><div className="rn">{fmtDate(h.date)}</div><div className="rs mono">{h.event}</div></div>
              ))}
              {history.length === 0 && <div className="empty-state">No attendance recorded yet.</div>}
            </div>
            <div className="btn-row">
              <button className="btn secondary" onClick={onClose}>Close</button>
              <button className="btn secondary" onClick={() => setEditing(true)}>Edit</button>
              <button className="btn danger" onClick={toggleActive}>{student.active === false ? "Mark Active" : "Mark Inactive"}</button>
            </div>
            {student.active === false && (
              <div className="btn-row" style={{ marginTop: 10 }}>
                <button className="btn danger" disabled={deleting} onClick={() => setPendingDelete(true)}>
                  Delete Permanently
                </button>
              </div>
            )}
          </>
        ) : (
          <>
            <h2>Edit {student.name}</h2>
            <div className="field"><label>Name</label><input value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} /></div>
            <div className="field"><label>Grade</label><input type="number" min="5" max="12" placeholder="Leave blank for leaders" value={form.grade ?? ""} onChange={e => setForm(f => ({ ...f, grade: e.target.value }))} /></div>
            <div className="field"><label>Birthday</label><input type="date" value={form.birthday || ""} onChange={e => setForm(f => ({ ...f, birthday: e.target.value }))} /></div>
            <div className="field-row">
              <div className="field"><label>Phone</label><input value={form.phone || ""} onChange={e => setForm(f => ({ ...f, phone: e.target.value }))} /></div>
              <div className="field"><label>Email</label><input value={form.email || ""} onChange={e => setForm(f => ({ ...f, email: e.target.value }))} /></div>
            </div>
            <div className="section-title">Emergency contact</div>
            <div className="field-row">
              <div className="field"><label>Relationship</label><input value={form.emergency?.relationship || ""} onChange={e => setForm(f => ({ ...f, emergency: { ...f.emergency, relationship: e.target.value } }))} /></div>
              <div className="field"><label>Name</label><input value={form.emergency?.name || ""} onChange={e => setForm(f => ({ ...f, emergency: { ...f.emergency, name: e.target.value } }))} /></div>
            </div>
            <div className="field-row">
              <div className="field"><label>Phone</label><input value={form.emergency?.phone || ""} onChange={e => setForm(f => ({ ...f, emergency: { ...f.emergency, phone: e.target.value } }))} /></div>
              <div className="field"><label>Email</label><input value={form.emergency?.email || ""} onChange={e => setForm(f => ({ ...f, emergency: { ...f.emergency, email: e.target.value } }))} /></div>
            </div>
            <div className="btn-row">
              <button className="btn secondary" onClick={() => setEditing(false)}>Cancel</button>
              <button className="btn primary" onClick={save}>Save</button>
            </div>
          </>
        )}
      </div>
      {pendingDelete && (
        <ConfirmDialog
          title="Delete permanently?"
          message={`${student.name} — this removes their profile AND all ${history.length} attendance record${history.length !== 1 ? "s" : ""} for good. This can't be undone.`}
          confirmLabel="Delete Permanently"
          cancelLabel="Cancel"
          danger
          onConfirm={confirmPermanentDelete}
          onCancel={() => setPendingDelete(false)}
        />
      )}
    </div>
  );
}

// Catches errors thrown DURING React's render (the most common crash source).
// This works even when window.onerror can't see through Babel's in-browser
// transform — React's own error handling never touches the browser's
// generic (and CORS-sanitizing) error reporting path at all.
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  componentDidMount() {
    // Route ALL fatal errors (window-level, Firestore listeners) through
    // this component's own setState from now on, instead of raw DOM writes —
    // so React manages the DOM change itself and nothing fights over it.
    reportFatalError = (details) => this.setState({ error: String(details) });
  }
  componentDidCatch(error, info) {
    const details =
      (error && (error.stack || error.message)) + "\n\nComponent stack:" +
      (info && info.componentStack ? info.componentStack : " (unavailable)");
    this.setState({ error: details });
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{ padding: 24, color: "#fff", background: "#0A0A0A", fontFamily: "monospace", whiteSpace: "pre-wrap", minHeight: "100vh", boxSizing: "border-box" }}>
          <h2 style={{ color: "#E10600", marginTop: 0 }}>Something went wrong</h2>
          <p style={{ fontFamily: "sans-serif" }}>Please screenshot this whole screen and send it over.</p>
          <pre style={{ background: "#1A1A1A", padding: 16, borderRadius: 8, overflow: "auto", border: "1px solid #3D3D3D" }}>
            {this.state.error}
          </pre>
        </div>
      );
    }
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
